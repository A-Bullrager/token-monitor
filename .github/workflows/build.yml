name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # The runner images move under this project without warning, and the history is
    # full of findings that only an OS-level change can produce: hdiutil detach
    # races, font metrics arriving after first paint, a window manager resizing on
    # its own schedule. A weekly run against main catches that drift while there is
    # no release waiting on the answer. The release job stays gated on a tag push.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-2022, platform: win32, arch: x64 }
          - { name: Linux x64, os: ubuntu-22.04, platform: linux, arch: x64 }
          - { name: macOS Apple Silicon, os: macos-15, platform: darwin, arch: arm64 }
          - { name: macOS Intel, os: macos-15-intel, platform: darwin, arch: x64 }
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      EXPECTED_PLATFORM: ${{ matrix.platform }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      # Where the downloaders put their files, told to them rather than guessed
      # from each platform's profile directory: the first attempt cached
      # runner.home-based paths and saved nothing at all (checked through the
      # caches API afterwards: zero `electron-` caches). `electron_config_cache` is
      # the name electron's own installer reads — ELECTRON_CACHE is not; the
      # fetcher documents that spelling, so both are set to the same directory —
      # and electron-builder has its own variable. Inside the workspace rather than
      # under the runner temp dir, because the `runner` context is not available in
      # a job-level `env` (a run that fails with "This run likely failed because of a
      # workflow file issue" is how that was learned), and because `build.files` in
      # package.json is an explicit list, so this directory cannot leak into a
      # shipped package.
      electron_config_cache: ${{ github.workspace }}/.download-cache/electron
      ELECTRON_CACHE: ${{ github.workspace }}/.download-cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.download-cache/electron-builder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          # Every round a cold runner re-downloaded the ~100MB Electron binary and
          # electron-builder's tooling before running anything — and two Apple
          # Silicon rounds failed in the minute they spent doing it, with
          # "Downloading Electron binary..." as the last honest line in the log.
          # These are exactly the directories the env block above points the tools
          # at; the key is the lockfile hash and the architecture, so a dependency
          # change cannot restore a stale binary and nothing crosses platforms.
          # Whether this saves anything is answered by the caches API after a green
          # round, not by the step being green — a cache that stores nothing still
          # reports success.
          path: |
            ${{ github.workspace }}/.download-cache/electron
            ${{ github.workspace }}/.download-cache/electron-builder
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ matrix.arch }}-
      - name: Check host, version and docs
        shell: bash
        run: |
          node -e "if(process.platform!==process.env.EXPECTED_PLATFORM||process.arch!==process.env.EXPECTED_ARCH)throw Error('Runner architecture mismatch')"
          npm run check:release
          npm run check:docs
      - run: npm ci --no-audit --no-fund
      - run: npm run icons
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2 libsecret-1-0
      - name: Test source on Windows and macOS
        if: runner.os != 'Linux'
        run: npm test
      - name: Test source on Linux (virtual X11 desktop)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1200x24' bash -e -c 'openbox >/tmp/token-monitor-openbox.log 2>&1 & npm test'
      - name: Build Windows portable ZIP
        if: runner.os == 'Windows'
        run: npm run package:win:zip
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: npm run package:linux
      - name: Build macOS DMG and ZIP (native architecture)
        if: runner.os == 'macOS'
        env:
          # Only certificate-free ad-hoc signing. Never expose signing secrets to PRs.
          CSC_FOR_PULL_REQUEST: 'true'
        shell: bash
        run: |
          # dmg-builder does not expose dmgbuild's --detach-retries, and the
          # runner's hdiutil occasionally loses the detach race ("Resource busy")
          # after the ZIP target already built. Retry a bounded number of times,
          # releasing only our own volume so nothing else can be unmounted.
          version=$(node -p "require('./package.json').version")
          attempt=0
          until npm run package:mac -- --${{ matrix.arch }}; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "::error::macOS package build failed on all 3 attempts; this is not a retryable detach race"
              exit 1
            fi
            echo "::notice::macOS package build failed; detaching stale volumes and retrying (attempt $attempt of 3)"
            for volume in /Volumes/Token\ Monitor*; do
              [ -d "$volume" ] && hdiutil detach "$volume" -force || true
            done
            rm -f "release/token-monitor-$version-mac-${{ matrix.arch }}.dmg"
            sleep 5
          done
          ls -l "release/token-monitor-$version-mac-${{ matrix.arch }}.dmg" \
                "release/token-monitor-$version-mac-${{ matrix.arch }}.zip"
      - name: Test extracted ZIP or DMG on Windows and macOS
        if: runner.os != 'Linux'
        run: npm run test:distributable
      - name: Test extracted AppImage on Linux
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1200x24' bash -e -c 'openbox >/tmp/token-monitor-openbox.log 2>&1 & npm run test:distributable'
      - name: Upload runnable packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          # A full matrix costs ~600MB of storage, and the release job consumes its
          # input within minutes of the run: 278 artifacts, 8.9GB, after a day of
          # ordinary rounds on a 14-day policy. Keep a two-week audit trail for the
          # run that actually published a release, and three days of grab-able
          # development builds otherwise — the README promises the latter, not the
          # former.
          retention-days: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && 14 || 3 }}
          compression-level: 0
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            shots/ui-report.json
            shots/numbers-report.json
            shots/i18n/*.json
            shots/i18n/*.png
            shots/packaged/**
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          path: downloads
          merge-multiple: true
      - name: Verify package set and create checksums
        working-directory: downloads
        shell: bash
        run: |
          node -e "const fs=require('fs'); const v=process.env.GITHUB_REF_NAME.slice(1); const want=['win-x64.zip','linux-x64.AppImage','mac-arm64.dmg','mac-arm64.zip','mac-x64.dmg','mac-x64.zip'].map(s=>'token-monitor-'+v+'-'+s); const files=fs.readdirSync('.'); if(files.length!==want.length || want.some(f=>!files.includes(f))) throw Error('Missing or unexpected release assets: '+files);"
          sha256sum *.zip *.dmg *.AppImage > SHA256SUMS.txt
      - name: Publish only after every native build and test succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Keep incomplete uploads in a draft. Never replace an existing public release.
          # The state file goes in its own directory: an earlier draft of this step
          # wrote it next to the assets, and one added `working-directory` would have
          # published that scratch JSON as a release asset.
          state=$(mktemp -d)
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$state/release-state.json" 2>/dev/null; then
            node -e "if(!require('$state/release-state.json').isDraft) throw Error('Release already published; use a new version tag')"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Token Monitor $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" downloads/* --clobber
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          fi
      - name: Confirm the published asset set is exactly what was built
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The job is not done when gh says OK: this is the same cross-check that
          # was done by hand after every release — six packages plus the checksum
          # list, the published digests matching the files the runners built, and
          # SHA256SUMS.txt itself agreeing with them, because that list is the only
          # thing a reader has to trust a download with. No apostrophes inside: the
          # script is passed in one single-quoted shell string.
          node -e '
          const crypto = require("node:crypto")
          const fs = require("node:fs")
          const { execFileSync } = require("node:child_process")
          const version = process.env.GITHUB_REF_NAME.slice(1)
          const packages = ["win-x64.zip", "linux-x64.AppImage", "mac-arm64.dmg", "mac-arm64.zip", "mac-x64.dmg", "mac-x64.zip"]
            .map((suffix) => `token-monitor-${version}-${suffix}`)
          const want = [...packages, "SHA256SUMS.txt"].sort()
          const released = JSON.parse(execFileSync("gh", ["release", "view", process.env.GITHUB_REF_NAME, "--json", "assets,isDraft,prerelease"], { encoding: "utf8" }))
          const names = released.assets.map((asset) => asset.name).sort()
          if (released.isDraft || released.prerelease) throw Error("published release is still a draft or a prerelease")
          const missing = want.filter((name) => !names.includes(name))
          const extra = names.filter((name) => !want.includes(name))
          if (missing.length || extra.length) throw Error(`asset set wrong: missing ${missing} extra ${extra}`)
          const published = new Map(released.assets.map((asset) => [asset.name, asset.digest]))
          const built = new Map(packages.map((name) => [name, crypto.createHash("sha256").update(fs.readFileSync(`downloads/${name}`)).digest("hex")]))
          const wrongDigests = packages.filter((name) => published.get(name) !== `sha256:${built.get(name)}`)
          if (wrongDigests.length) throw Error(`published digests differ from the built files: ${wrongDigests}`)
          const listed = new Map(fs.readFileSync("downloads/SHA256SUMS.txt", "utf8").trim().split(/\r?\n/)
            .map((line) => line.trim().split(/\s+/)).map(([hash, file]) => [file, hash]))
          const wrongList = packages.filter((name) => listed.get(name) !== built.get(name))
          if (wrongList.length) throw Error(`SHA256SUMS.txt does not match the built files: ${wrongList}`)
          console.log(`Published ${names.length} assets; digests and SHA256SUMS.txt both match the files the runners built.`)
          '
